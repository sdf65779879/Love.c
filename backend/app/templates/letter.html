<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <style>
    @media (prefers-color-scheme: dark) {
      .desk { background-color:#211d20 !important }
      .paper { background-color:#31282d !important; border-color:#55434a !important }
      .ink { color:#fae9e4 !important }
      .muted { color:#dfc6c6 !important }
      .rose { color:#ffbec9 !important }
      .panel { background-color:#442e39 !important; border-color:#895866 !important }
      .rule { border-color:#644b55 !important }
    }
  </style>
</head>
<body class="desk" style="margin:0;background-color:#f5efec;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">
  <div style="display:none;visibility:hidden;max-height:0;overflow:hidden;mso-hide:all;">$preview</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" class="desk" bgcolor="#f5efec">
    <tr><td align="center" style="padding:20px 12px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" class="paper" bgcolor="#fffaf6" style="max-width:500px;border:1px solid #dfcfca;border-top:4px solid #b85f72;border-radius:6px;">
        <tr><td style="padding:22px 24px 0;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr>
            <td class="rose" style="color:#943f55;font: bold 19px Georgia,serif;letter-spacing:2px;">LOVE.C</td>
            <td align="right" class="rose" style="color:#943f55;font-size:12px;letter-spacing:1px;">双人通信&nbsp; ♡</td>
          </tr></table>
        </td></tr>
        <tr><td style="padding:24px 24px 0;">
          <p class="muted" style="margin:0 0 10px;color:#76615f;font-size:14px;line-height:1.65;overflow-wrap:anywhere;">$greeting</p>
          <h1 class="ink" style="margin:0;color:#422e35;font:600 25px/1.55 Georgia,'Songti SC',SimSun,serif;">$heading</h1>
          <p class="ink" style="margin:12px 0 0;color:#57434a;font-size:15px;line-height:1.85;">$note</p>
        </td></tr>
        <tr><td style="padding:20px 24px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" class="panel" bgcolor="#fae9eb" style="border:1px solid #e9c9cd;border-radius:6px;">
            <tr><td align="center" style="padding:15px 8px;">
              <p class="muted" style="margin:0;color:#79595e;font-size:13px;line-height:1.6;">$label</p>
              <p class="rose" style="margin:5px 0;color:#87384d;font-family:Georgia,'Songti SC',serif;font-size:$size;line-height:1.3;font-weight:bold;letter-spacing:3px;">$highlight</p>
              <p class="muted" style="margin:4px 0 0;color:#74555a;font-size:12px;line-height:1.65;">$detail</p>
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:0 24px 22px;">
          <p class="muted" style="margin:0;color:#76615f;font-size:13px;line-height:1.8;">$reminder</p>
          <p class="rose rule" style="margin:19px 0 0;padding-top:15px;border-top:1px dashed #dcbdc0;color:#943f55;font:15px/1.65 Georgia,'Songti SC',serif;text-align:right;">爱你的，我们的小站</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
