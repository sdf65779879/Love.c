server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 31m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: http: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' https: data:; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /source.tar.gz {
        auth_request /private-access;
        add_header Content-Disposition 'attachment; filename="likegirl-source.tar.gz"';
        try_files $uri =404;
    }
    location = /private-access {
        internal;
        proxy_pass http://api:8000/api/visitor/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /images/ { expires 1d; try_files $uri =404; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
